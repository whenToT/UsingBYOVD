name: Build UsingBYOVD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    - name: Build Release x64
      run: msbuild UsingBYOVD.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UsingBYOVD-x64-Release
        path: |
          x64/Release/UsingBYOVD.exe
          RawDriverFiles/*.sys
