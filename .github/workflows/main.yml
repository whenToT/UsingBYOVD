name: Build UsingBYOVD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    
    - name: Fix xstddef include
      shell: pwsh
      run: |
        $file = "DriverUtils\ObjectProxy.hpp"
        $content = Get-Content $file -Raw
        $content = $content -replace '#include <xstddef>\r?\n', ''
        Set-Content $file $content -NoNewline
    
    - name: Fix C++20 compatibility
      shell: pwsh
      run: |
        $file = "DriverUtils\DriverLoader.cpp"
        $content = Get-Content $file -Raw
        $content = $content -replace 'std::ifstream readFile\(DriverPath,', 'std::ifstream readFile(std::string(DriverPath),'
        Set-Content $file $content -NoNewline
        
        $file = "DriverUtils\DriverSelector.hpp"
        $content = Get-Content $file -Raw
        $content = $content -replace 'std::any_cast<GetKillerImpl<_Type>::Type>', 'std::any_cast<typename GetKillerImpl<_Type>::Type>'
        $content = $content -replace 'std::any_cast<GetProviderImpl<_Type>::Type>', 'std::any_cast<typename GetProviderImpl<_Type>::Type>'
        Set-Content $file $content -NoNewline
    
    - name: Build Release x64 (Static Link)
      shell: cmd
      run: |
        msbuild UsingBYOVD.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:RuntimeLibrary=MultiThreaded
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UsingBYOVD-x64-Release-Static
        path: |
          x64/Release/UsingBYOVD.exe
          RawDriverFiles/*.sys
