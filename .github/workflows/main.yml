name: Build UsingBYOVD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    
    - name: Build Release x64
      shell: cmd
      run: |
        msbuild UsingBYOVD.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UsingBYOVD-x64-Release
        path: |
          x64/Release/UsingBYOVD.exe
          RawDriverFiles/*.sys
